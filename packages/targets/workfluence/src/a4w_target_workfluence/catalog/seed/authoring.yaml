# Workfluence seed의 사람 쪽 글 (Phase 2 설계 6.4·7.3절, FR-235). 개발 세션(Claude)이 명세를 읽고 썼다.
# seed 도구(a4w-seedtool build)가 이 글 + 기계 변환 골격으로 seed/tools/*.json과 지문을 만든다.
#
# 입력 칸 규칙 (설계 6.3.1): 여기 적지 않은 칸은 기계 기본(명세 기본값이 있는 선택 칸은 숨김=보내지 않음).
# 보이는 칸 설명에는 값을 어디서 얻는지 적는다. space는 agent의 기본 스페이스(맥락 homeSpace)로 고정된다.
# 기준 명세: 시험 스택 openapi.yaml sha256 8c83f9c6… (동작 75개)

# ── 탐색·읽기 (read)
spaces.list:
  name: list_spaces
  title: 스페이스 목록 보기
  description: 내가 볼 수 있는 스페이스 목록을 이름·설명·쓰기 가능 여부와 함께 본다. 이름 일부로 좁힐 수 있다. 많으면 잘리고 truncated가 true다.
  inputs:
    q: {description: "찾을 스페이스 이름의 일부 — 요청 글에 스페이스 이름이 있을 때만 넣는다. 대소문자 무시"}
    limit: {description: 돌려줄 최대 수, hide: true}
  responseFields: ["items[].id", "items[].name", "items[].description", "items[].canWrite", truncated]
  index:
    summary: 위키의 스페이스(공간) 목록을 보여 준다
    examples: ["어떤 스페이스들이 있어?", "개발팀 스페이스 찾아줘", "내가 쓸 수 있는 공간 목록 보여줘"]

spaces.get:
  name: get_space
  title: 스페이스 정보 보기
  description: 스페이스 하나의 이름·설명·상태와 내 역할(myRole), 쓸 수 있는지(canWrite)를 본다.
  inputs:
    id: {description: "스페이스 id — list_spaces 결과의 items[].id"}
  responseFields: [id, name, description, status, myRole, canWrite]
  index:
    summary: 스페이스 하나의 정보와 내 권한을 본다
    examples: ["이 스페이스 설명 알려줘", "내가 이 공간에 글을 쓸 수 있어?", "스페이스 상태 확인해줘"]

pages.tree:
  name: list_pages
  title: 기본 스페이스의 페이지 목록 보기
  description: agent의 기본 스페이스에 있는 페이지를 본문 없이 제목·부모(parentId)와 함께 본다. 트리는 parentId로 그린다. 많으면 잘리고 truncated가 true다(total은 전체 수). 본문은 read_page로 읽는다.
  inputs:
    limit: {description: 돌려줄 최대 수, hide: true}
  responseFields: ["items[].id", "items[].title", "items[].parentId", total, truncated]
  index:
    summary: 기본 스페이스의 페이지 목록(트리)을 보여 준다
    examples: ["우리 위키에 어떤 페이지가 있어?", "페이지 목록 보여줘", "문서 구조 알려줘"]

pages.get:
  name: read_page
  title: 페이지 읽기
  description: 페이지 하나를 본문(마크다운)과 함께 읽는다. 지금 버전 번호(currentVersionNo)가 함께 온다 — 이 페이지를 고칠 때 update_page의 baseVersionNo로 그대로 쓴다. 제목만 알면 read_page_by_title을 쓴다.
  inputs:
    id: {description: "페이지 id — search_pages 결과의 items[].pageId나 list_pages 결과의 items[].id"}
  responseFields: [id, title, body, currentVersionNo, "ancestors[].title", updatedAt]
  index:
    summary: 위키 페이지 하나의 본문을 읽는다
    examples: ["이 페이지 내용 보여줘", "회의록 본문 읽어줘", "문서 열어서 읽어줘"]

search.find:
  name: search_pages
  title: 페이지 검색
  description: 기본 스페이스에서 제목과 본문으로 페이지를 찾는다. 검색어는 두 글자부터 된다. 결과의 pageId로 다른 tool을 부른다. 기본 20개까지 돌려준다.
  inputs:
    q: {description: "검색어 — 요청 글의 핵심 낱말. 두 글자 이상, 200자까지"}
  responseFields: ["items[].pageId", "items[].title", "items[].snippet", "items[].updatedAt"]
  index:
    summary: 제목·본문으로 위키 페이지를 검색한다
    examples: ["보안 정책 문서 찾아줘", "지난주 회의록 검색해줘", "배포 절차가 적힌 페이지 있어?"]

labels.list:
  name: list_labels
  title: 라벨 목록 보기
  description: 위키에서 쓰이는 라벨(태그) 이름 목록을 본다. 기본 100개까지 돌려준다.
  responseFields: ["[].name"]
  index:
    summary: 위키에 쓰이는 라벨(태그) 목록을 본다
    examples: ["어떤 라벨들이 있어?", "태그 목록 보여줘", "쓰이는 분류 라벨 알려줘"]

labels.pages:
  name: list_pages_by_label
  title: 라벨이 붙은 페이지 보기
  description: 라벨 하나가 붙은, 내가 읽을 수 있는 페이지 목록을 본다. 기본 100개까지 돌려준다.
  inputs:
    name: {description: "라벨 이름 — 요청 글에 있는 라벨이나 list_labels 결과의 name"}
  responseFields: ["items[].pageId", "items[].title", "items[].spaceName", "items[].updatedAt"]
  index:
    summary: 특정 라벨(태그)이 붙은 페이지를 찾는다
    examples: ["긴급 라벨 붙은 문서 보여줘", "회의록 태그 달린 페이지 목록", "보안 라벨 페이지들 찾아줘"]

labels.forPage:
  name: list_page_labels
  title: 페이지의 라벨 보기
  description: 페이지 하나에 붙은 라벨을 본다.
  inputs:
    pageId: {description: "페이지 id — search_pages 결과의 items[].pageId"}
  responseFields: ["[].name"]
  index:
    summary: 페이지 하나에 붙은 라벨(태그)을 본다
    examples: ["이 문서에 어떤 태그가 붙었어?", "페이지 라벨 확인해줘", "이 글의 분류 라벨 알려줘"]

categories.list:
  name: list_categories
  title: 분류 목록 보기
  description: 스페이스를 묶는 분류의 목록을 본다.
  responseFields: ["[].id", "[].name"]
  index:
    summary: 스페이스를 묶는 분류 목록을 본다
    examples: ["스페이스 분류 뭐 있어?", "카테고리 목록 보여줘", "공간 분류 알려줘"]

templates.list:
  name: list_templates
  title: 페이지 템플릿 보기
  description: 새 페이지의 본문으로 쓸 틀(템플릿)을 본다. 고른 템플릿의 body를 create_page의 body로 보내면 된다.
  responseFields: ["items[].name", "items[].description", "items[].body"]
  index:
    summary: 새 페이지를 만들 때 쓸 템플릿을 본다
    examples: ["회의록 템플릿 있어?", "문서 양식 보여줘", "페이지 만들 틀 목록 알려줘"]

attachments.list:
  name: list_attachments
  title: 페이지의 첨부 보기
  description: 페이지에 올린 첨부 파일 목록을 이름·크기와 함께 본다. href를 본문에 [이름](주소)로 넣으면 사람이 눌러 받는다.
  inputs:
    pageId: {description: "페이지 id — search_pages 결과의 items[].pageId"}
  responseFields: ["items[].id", "items[].filename", "items[].size", "items[].href"]
  index:
    summary: 페이지에 붙은 첨부 파일 목록을 본다
    examples: ["이 페이지에 첨부된 파일 뭐야?", "첨부 목록 보여줘", "회의록에 올린 파일 알려줘"]

attachments.download:
  name: download_attachment
  title: 첨부 내용 받기
  description: 첨부 파일 하나의 내용을 JSON으로 받는다. 글 파일은 utf8 글로, 이진 파일은 base64로 온다. 1000000바이트(기본값)를 넘으면 413이다. 받은 일은 감사로그에 남는다.
  inputs:
    id: {description: "첨부 id — list_attachments 결과의 items[].id"}
  index:
    summary: 첨부 파일의 내용을 받아 읽는다
    examples: ["첨부된 문서 내용 읽어줘", "그 파일 열어봐줘", "첨부 파일 내용 보여줘"]

# ── 이력 (history)
pages.versions:
  name: list_page_versions
  title: 페이지 버전 이력 보기
  description: 페이지의 버전 번호·제목·고친 사람·시각 목록을 본문 없이 본다. 버전 본문은 read_page_version으로, 두 버전 차이는 compare_page_versions로 본다.
  inputs:
    id: {description: "페이지 id — search_pages 결과의 items[].pageId"}
  responseFields: ["[].versionNo", "[].title", "[].createdByName", "[].createdAt"]
  index:
    summary: 페이지가 언제 누가 고쳤는지 버전 이력을 본다
    examples: ["이 문서 누가 언제 고쳤어?", "페이지 수정 이력 보여줘", "버전 기록 알려줘"]

pages.version:
  name: read_page_version
  title: 옛 버전 읽기
  description: 페이지의 옛 버전 하나의 본문을 읽는다.
  inputs:
    id: {description: "페이지 id — search_pages 결과의 items[].pageId"}
    "no": {description: "버전 번호 — list_page_versions 결과의 versionNo"}
  responseFields: [versionNo, title, body, createdByName, createdAt]
  index:
    summary: 페이지의 예전 버전 본문을 읽는다
    examples: ["이 문서 예전 버전 보여줘", "첫 번째 버전 내용 읽어줘", "고치기 전 내용 알려줘"]

pages.diff:
  name: compare_page_versions
  title: 두 버전 비교
  description: 페이지의 앞 버전(a)에서 뒤 버전(b)으로 무엇이 바뀌었는지 추가·삭제·수정 수와 블록별 차이로 본다.
  inputs:
    id: {description: "페이지 id — search_pages 결과의 items[].pageId"}
    a: {description: "앞 버전 번호 — list_page_versions 결과의 versionNo"}
    b: {description: "뒤 버전 번호 — list_page_versions 결과의 versionNo"}
  responseFields: [titleChanged, diff.added, diff.removed, diff.modified, diff.blocks]
  index:
    summary: 페이지의 두 버전 사이에 바뀐 내용을 비교한다
    examples: ["이전 버전이랑 뭐가 달라졌어?", "두 버전 차이 비교해줘", "최근 수정에서 바뀐 부분 알려줘"]

# ── 소통 (communication)
comments.list:
  name: list_comments
  title: 페이지의 댓글 보기
  description: 페이지에 달린 댓글과 답글을 시간순으로 본다. 답글은 parentId가 상위 댓글 id다.
  inputs:
    pageId: {description: "페이지 id — search_pages 결과의 items[].pageId"}
  responseFields: ["items[].id", "items[].author", "items[].body", "items[].parentId", "items[].createdAt"]
  index:
    summary: 페이지에 달린 댓글과 답글을 본다
    examples: ["이 문서에 달린 댓글 보여줘", "사람들이 무슨 의견 남겼어?", "회의록 댓글 읽어줘"]

comments.create:
  name: add_comment
  title: 페이지에 댓글 달기
  description: 페이지에 새 댓글을 단다. 본문은 마크다운이고 원시 HTML·그림은 400이다. 본문의 @사용자는 멘션이 되어 알림이 간다. 제목만 알면 comment_on_page_by_title을 쓴다.
  inputs:
    pageId: {description: "댓글을 달 페이지 id — search_pages 결과의 items[].pageId"}
    body: {description: "댓글 본문 (마크다운 글)"}
  responseFields: [id, createdAt]
  index:
    summary: 위키 페이지에 댓글을 남긴다
    examples: ["이 문서에 확인했다고 댓글 달아줘", "회의록에 의견 남겨줘", "페이지에 질문 댓글 써줘"]

comments.update:
  name: edit_comment
  title: 댓글 고치기
  description: 내가 쓴 댓글의 본문을 고친다. 남의 댓글은 고칠 수 없다. 본문은 마크다운이다.
  inputs:
    id: {description: "고칠 댓글 id — list_comments 결과의 items[].id"}
    body: {description: "새 댓글 본문 (마크다운 글)"}
  responseFields: [id, updatedAt]
  index:
    summary: 내가 쓴 댓글 내용을 고친다
    examples: ["내 댓글 내용 고쳐줘", "아까 단 댓글 수정해줘", "댓글 오타 고쳐줘"]

comments.delete:
  name: delete_comment
  title: 댓글 지우기
  description: 댓글 하나를 지운다. 쓴 사람이나 그 페이지를 지울 권한이 있는 사람만 지운다. 답글은 함께 지워지지 않는다.
  inputs:
    id: {description: "지울 댓글 id — list_comments 결과의 items[].id"}
  index:
    summary: 페이지의 댓글을 지운다
    examples: ["내 댓글 지워줘", "잘못 단 댓글 삭제해줘", "그 댓글 없애줘"]

notifications.list:
  name: list_notifications
  title: 내 알림 보기
  description: agent 자신에게 온 알림(멘션·댓글 등)을 본다. 남의 알림은 볼 수 없다. 기본 100개까지 돌려준다.
  responseFields: ["items[].id", "items[].kind", "items[].pageTitle", "items[].actorName", "items[].createdAt", "items[].readAt"]
  index:
    summary: 나에게 온 알림(멘션·댓글)을 본다
    examples: ["나한테 온 알림 있어?", "누가 나를 멘션했어?", "새 알림 보여줘"]

notifications.unreadCount:
  name: count_unread_notifications
  title: 안 읽은 알림 수 보기
  description: agent 자신의 안 읽은 알림 수를 본다.
  responseFields: [count]
  index:
    summary: 안 읽은 알림이 몇 개인지 본다
    examples: ["안 읽은 알림 몇 개야?", "새 알림 수 알려줘", "확인 안 한 알림 있어?"]

notifications.read:
  name: mark_notification_read
  title: 알림 하나 읽음 표시
  description: 알림 하나를 읽음으로 표시한다. 남의 알림이면 404다.
  inputs:
    id: {description: "알림 id — list_notifications 결과의 items[].id"}
  index:
    summary: 알림 하나를 읽음으로 표시한다
    examples: ["그 알림 읽음으로 해줘", "이 알림 확인 처리해줘", "알림 하나 읽은 걸로 바꿔줘"]

notifications.readAll:
  name: mark_all_notifications_read
  title: 알림 모두 읽음 표시
  description: agent 자신의 알림을 모두 읽음으로 표시하고 바뀐 수를 돌려준다.
  responseFields: [count]
  index:
    summary: 내 알림을 모두 읽음으로 표시한다
    examples: ["알림 다 읽음으로 해줘", "알림 모두 확인 처리", "쌓인 알림 정리해줘"]

# ── 작성 (authoring)
pages.create:
  name: create_page
  title: 새 페이지 만들기
  description: agent의 기본 스페이스 맨 위에 새 페이지를 만든다. 본문은 마크다운이고 원시 HTML·그림·허용 밖 링크는 400이다. 만들기는 실패해도 만들어졌을 수 있으니 다시 하기 전에 search_pages로 확인한다.
  inputs:
    title: {description: "페이지 제목 — 300자까지"}
    body: {description: "본문 (마크다운 글). 템플릿을 쓰면 list_templates 결과의 body"}
  responseFields: [id, title, currentVersionNo]
  index:
    summary: 위키에 새 페이지(문서)를 만든다
    examples: ["회의록 페이지 새로 만들어줘", "오늘 작업 내용을 문서로 올려줘", "새 위키 페이지 작성해줘"]

pages.update:
  name: update_page
  title: 페이지 고치기
  description: 페이지의 제목이나 본문을 고친다. 보낸 것만 바뀌고 본문은 통째로 바뀐다(부분 수정 없음). 먼저 read_page로 읽고 받은 currentVersionNo를 baseVersionNo로 꼭 보낸다. 그 사이 다른 저장이 있으면 409 VERSION_CONFLICT, 누가 편집 중이면 409 PAGE_BEING_EDITED다 — 다시 읽고 합쳐서 고친다.
  inputs:
    id: {description: "고칠 페이지 id — read_page 결과의 id"}
    baseVersionNo: {description: "기준 버전 — read_page 결과의 currentVersionNo를 그대로"}
    body: {description: "새 본문 전체 (마크다운 글). 고치지 않으면 비운다"}
    title: {description: "새 제목. 고치지 않으면 비운다"}
  responseFields: [id, title, currentVersionNo]
  index:
    summary: 위키 페이지의 제목이나 본문을 고친다
    examples: ["이 문서 내용 고쳐줘", "회의록에 결정 사항 추가해줘", "페이지 제목 바꿔줘"]

labels.attach:
  name: add_page_label
  title: 페이지에 라벨 붙이기
  description: 페이지에 라벨(태그)을 붙인다. 없는 라벨이면 만든다. 이름은 소문자로 저장된다.
  inputs:
    pageId: {description: "페이지 id — search_pages 결과의 items[].pageId"}
    name: {description: "라벨 이름 — 40자까지"}
  responseFields: [id, name]
  index:
    summary: 페이지에 라벨(태그)을 붙인다
    examples: ["이 문서에 긴급 라벨 붙여줘", "회의록 태그 달아줘", "페이지에 보안 라벨 추가해줘"]

labels.detach:
  name: remove_page_label
  title: 페이지에서 라벨 떼기
  description: 페이지에서 라벨 하나를 뗀다.
  inputs:
    pageId: {description: "페이지 id — search_pages 결과의 items[].pageId"}
    ref: {description: "뗄 라벨의 이름 — list_page_labels 결과의 name"}
  index:
    summary: 페이지에 붙은 라벨(태그)을 뗀다
    examples: ["이 문서에서 긴급 라벨 떼줘", "태그 지워줘", "페이지 라벨 하나 빼줘"]

# ── 위험 동작 (danger, 기본 꺼짐. 켜도 추가는 사람 확인)
pages.delete:
  name: delete_page
  title: 페이지 지우기 (휴지통으로)
  description: 페이지를 휴지통으로 보낸다. 보존 기간 안에는 restore_trashed_page로 되살린다.
  inputs:
    id: {description: "지울 페이지 id — search_pages 결과의 items[].pageId"}
  index:
    summary: 위키 페이지를 휴지통으로 지운다
    examples: ["이 페이지 지워줘", "필요 없는 초안 삭제해줘", "문서 휴지통에 버려줘"]

pages.move:
  name: move_page
  title: 페이지 옮기기
  description: 페이지를 다른 부모 페이지 아래로 옮긴다. 형제의 맨 끝에 놓인다.
  inputs:
    id: {description: "옮길 페이지 id — search_pages 결과의 items[].pageId"}
    parentId: {description: "새 부모 페이지 id — search_pages 결과의 pageId. 맨 위로 옮기려면 null"}
  responseFields: [id, parentId, title]
  index:
    summary: 페이지를 다른 페이지 아래로 옮긴다
    examples: ["이 문서를 회의록 아래로 옮겨줘", "페이지 위치 바꿔줘", "맨 위로 옮겨줘"]

pages.restoreVersion:
  name: restore_page_version
  title: 옛 버전으로 되돌리기
  description: 페이지를 옛 버전의 내용으로 되돌린다(새 버전으로 더해지고 이력은 남는다). 누가 편집 중이면 409 PAGE_BEING_EDITED다.
  inputs:
    id: {description: "페이지 id — search_pages 결과의 items[].pageId"}
    "no": {description: "되돌릴 버전 번호 — list_page_versions 결과의 versionNo"}
  responseFields: [id, currentVersionNo]
  index:
    summary: 페이지를 예전 버전 내용으로 되돌린다
    examples: ["어제 버전으로 되돌려줘", "고치기 전으로 복원해줘", "첫 버전 내용으로 돌려줘"]

attachments.upload:
  name: upload_attachment
  title: 첨부 올리기
  description: 페이지에 글 파일을 첨부로 올린다(utf8 글). 형식은 확장자로 정하고 허용 확장자만 올라간다. 파일 이름에 / \ 를 쓸 수 없다.
  inputs:
    pageId: {description: "첨부를 올릴 페이지 id — search_pages 결과의 items[].pageId"}
    filename: {description: "파일 이름 (예: 요약.txt) — 255자까지"}
    content: {description: "파일 내용 (글)"}
  responseFields: [id, filename, href]
  index:
    summary: 페이지에 파일을 첨부로 올린다
    examples: ["이 내용을 파일로 첨부해줘", "회의록에 메모 파일 올려줘", "문서에 텍스트 파일 붙여줘"]

attachments.delete:
  name: delete_attachment
  title: 첨부 지우기
  description: 첨부 파일 하나를 지운다. 쓸 수 있는 사람이나 올린 사람만 지운다.
  inputs:
    id: {description: "지울 첨부 id — list_attachments 결과의 items[].id"}
  index:
    summary: 페이지의 첨부 파일을 지운다
    examples: ["그 첨부 파일 지워줘", "잘못 올린 파일 삭제해줘", "첨부 없애줘"]

trash.pages:
  name: list_trashed_pages
  title: 휴지통의 페이지 보기
  description: 내가 되살릴 수 있는, 휴지통에 있는 페이지를 본다. 기본 100개까지 돌려준다.
  responseFields: ["items[].id", "items[].title", "items[].spaceName", "items[].deletedAt"]
  index:
    summary: 휴지통에 있는 지운 페이지를 본다
    examples: ["휴지통에 뭐 있어?", "지운 문서 목록 보여줘", "삭제된 페이지 찾아줘"]

trash.restorePage:
  name: restore_trashed_page
  title: 지운 페이지 되살리기
  description: 휴지통의 페이지를 되살린다. 부모가 없어졌으면 맨 위로 되살리고 movedToRoot가 참이다.
  inputs:
    id: {description: "되살릴 페이지 id — list_trashed_pages 결과의 items[].id"}
  responseFields: [ok, movedToRoot]
  index:
    summary: 휴지통에서 지운 페이지를 되살린다
    examples: ["지운 문서 되살려줘", "휴지통에서 페이지 복구해줘", "실수로 지운 페이지 살려줘"]
