  - {query: "이 문서 삭제해", expect: [delete_page], danger: true}
  - {query: "문서를 다른 페이지 밑으로 이동", expect: [move_page], danger: true}
  - {query: "지난 버전으로 복구해줘", expect: [restore_page_version], danger: true}
