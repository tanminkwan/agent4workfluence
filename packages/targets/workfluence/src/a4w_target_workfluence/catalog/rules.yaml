# Workfluence tool 대상 선정 규칙 (Phase 2 설계 5.1절, 과제정의서 4.3절).
# 위에서부터 처음 맞는 규칙 하나만 쓴다. 켜고 끄기는 타겟 .env의 TOOL_GROUPS_ENABLED다.
version: 1

groups:                      # 묶음 → 위험 등급의 바닥값 (auto는 메서드로: GET→read, 그 밖→write)
  read:          {risk: read}
  history:       {risk: read}
  communication: {risk: auto}
  authoring:     {risk: write}
  danger:        {risk: danger}

scopeImplies:                # write scope는 read를 포함한다 (명세 info.description)
  write: [read]

rules:
  - match: {pathPrefix: /chat/}
    exclude: NOT_NEEDED      # 채팅은 tool 대상이 아니다. 채팅 API는 Detection·Manufacture 대상이 아니고 Phase 5 어댑터 코드가 부른다
  - match: {scope: admin}
    exclude: ADMIN
  - match: {operationId: ["spec.*"]}
    exclude: SPEC_META
  - match:
      operationId: [spaces.create, spaces.update, spaces.delete, spaces.members, spaces.addMember,
                    spaces.removeMember, spaces.setMemberRole, spaces.setStatus,
                    categories.create, categories.rename, categories.delete,
                    templates.create, templates.update, templates.delete]
    exclude: STRUCTURE_CHANGE
  - match: {operationId: [pages.export, trash.spaces, trash.restoreSpace]}
    exclude: NOT_NEEDED
  - match:
      operationId: [pages.delete, pages.move, pages.restoreVersion, attachments.upload,
                    attachments.delete, trash.pages, trash.restorePage]
    group: danger
  - match: {operationId: [pages.versions, pages.version, pages.diff]}
    group: history
  - match: {operationId: ["comments.*", "notifications.*"]}
    group: communication
  - match: {operationId: [pages.create, pages.update, labels.attach, labels.detach]}
    group: authoring
  - match: {method: GET}
    group: read

fallback:                    # 위 규칙에 하나도 맞지 않는 새 동작
  byMethod: {GET: read, DELETE: danger}
  default: authoring

transform:                   # 명세만으로 알 수 없는 고정값 (FR-233)
  - match: {operationId: [attachments.download]}
    fixed: {query: {format: json}}   # 응답을 JSON(base64)으로 받는다

context:                     # agent가 늘 쓰는 맥락. 모델에게 묻지 않고 실행하는 쪽이 값을 넣는다 (설계 6.3.1)
  homeSpace:                 # agent의 기본 스페이스 (값: 타겟 설정 AGENT_CONTEXT, 검증 때는 시험 스페이스)
    bind:
      - {in: query, name: space}      # search.find, pages.tree 등의 space
      - {in: body, pointer: /space}   # pages.create의 space
