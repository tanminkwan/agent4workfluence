            "application/json":
              schema:
                additionalProperties: false
                properties:
                  author:
                    description: "쓴 사람의 이름"
                    type: string
                  body:
                    anyOf:
                      - type: string
                      - additionalProperties: {}
                        properties:
                          type:
                            description: "문서 노드의 종류(doc·paragraph·heading 등)"
                            type: string
                        required:
                          - type
                        type: object
                    description: "format이 json이면 문서 객체, 아니면 글자"
                  canDelete:
                    description: "내가 지울 수 있으면 true"
                    type: boolean
                  createdAt:
                    description: "ISO 8601 시각(UTC)"
                    type: string
                  format:
                    description: "본문의 형식 — markdown·json·text"
                    enum:
                      - markdown
                      - json
                      - text
                    type: string
                  id:
                    description: "그 대상의 id — 다른 호출의 경로에 넣는다"
                    type: string
                  pageId:
                    description: "페이지의 id"
                    type: string
                  parentId:
                    description: "부모의 id — 맨 위면 null"
                    type:
                      - string
                      - "null"
                  updatedAt:
                    description: "ISO 8601 시각(UTC)"
                    type: string
                required:
                  - id
                  - pageId
                  - parentId
                  - author
                  - createdAt
                  - updatedAt
                  - canDelete
                  - format
                  - body
                type: object
          description: "성공"
        "400":
