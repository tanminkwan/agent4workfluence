components:
  schemas:
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              description: "고정 문자열 — 분기는 이것으로"
              type: string
            details: {}
            message:
              type: string
            requestId:
              description: "로그·감사 행과 같은 요청 번호"
              type:
                - string
                - "null"
          required:
            - code
            - message
            - requestId
          type: object
      required:
        - error
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "화면의 내 정보에서 발급한 API 토큰. `Authorization: Bearer <토큰>`"
      scheme: bearer
      type: http
info:
  description: |-
    사내 위키(워크플루언스)의 기능을 프로그램·에이전트가 쓰는 REST API다. 화면과 같은 서비스·권한을 쓴다 — **토큰은 그 주인이 화면에서 할 수 있는 일을 넘지 못한다.**

    인증: 화면의 내 정보에서 토큰을 발급해 `Authorization: Bearer <토큰>`으로 보낸다(쿠키·CSRF 헤더는 필요 없다). scope는 read(읽기)·write(쓰기, read 포함)·admin(관리 경로에 **더** 필요).
    빈도 제한: 토큰마다 읽기 120번·쓰기 30번 / 60초. 넘으면 429와 `Retry-After`.
    오류: 모두 `{ "error": { "code", "message", "requestId" } }` 한 모양이다. 분기는 문장이 아니라 `code`로 한다. `requestId`를 알려 주면 운영자가 로그·감사에서 그 요청을 찾는다.
    본문: 읽기는 markdown(기본)·json·text, 쓰기는 markdown(기본)·json. 만들 때 필수는 대개 이름·제목·본문뿐이고 나머지는 서버가 기본값(예: 목록 200개)으로 채워 응답이 그 값을 말한다.
    주소: 이 명세를 받은 서버의 주소 + `/api/v1`. 경로는 모두 `/api/v1`을 뺀 꼴로 적었다.
    토큰: 사람이 화면(내 정보 → API 토큰)에서 발급·폐기한다 — 이 API에는 발급·폐기 경로가 없다. 유효기간은 발급할 때 고르며 기본 90일·최대 365일, 사람마다 10개까지. 갱신은 없다 — 만료·폐기되면 사람이 새로 발급해 넘긴다. 비밀번호 변경·정지·강제 종료는 토큰을 모두 끊는다.
    오류 코드 — 401: `TOKEN_MISSING`(헤더 없음)·`TOKEN_INVALID`(서명·형식이 틀림)·`TOKEN_UNKNOWN`(서명은 맞는데 그 번호·주인의 발급 기록이 없음)·`TOKEN_EXPIRED`(만료)·`TOKEN_REVOKED`(폐기)·`ACCOUNT_INACTIVE`(주인이 정지됨 등 활성이 아님) — 모두 사람이 새 토큰을 받거나 풀어야 하니 재시도하지 말고 멈춘다. 403: `INSUFFICIENT_SCOPE`·`FORBIDDEN`·`PASSWORD_CHANGE_REQUIRED`(주인이 화면에서 비밀번호를 바꿔야 토큰을 쓸 수 있음). 400: `INVALID_REQUEST`(`message`가 칸과 까닭을 말한다)·`INVALID_JSON`. 404: `NOT_FOUND`·`SPACE_NOT_FOUND` 등. 409: 각 동작의 409 설명을 본다. 413: `PAYLOAD_TOO_LARGE`·`TOO_LARGE_FOR_JSON`. 429: `RATE_LIMITED`. 503: `API_DISABLED`(서버에서 공개 API를 꺼 둠). 500: `INTERNAL` — `requestId`를 운영자에게 알린다.
    고칠 때: 페이지 고치기는 본문 **전체 교체**다(부분 수정이 없다). 읽은 `currentVersionNo`를 `baseVersionNo`로 꼭 보낸다 — 그래야 그 사이 남의 고침을 덮지 않는다(안 보내면 400). 같은 요청을 되풀이해도 중복을 막는 키는 없다: 만들기(POST)는 실패해도 만들어졌을 수 있으니 다시 보내기 전에 목록으로 확인한다.
    `format`: 쿼리의 `format`은 **응답**에 실을 본문 형식이고, 요청 본문의 `format`은 **보내는** `body`의 형식이다(둘은 따로 정한다). 마크다운은 원시 HTML·그림 문법·허용 밖 링크를 받지 않고 400이다.
    목록: 쪽 나누기가 없다. 모두 `limit`까지만 돌려주고(동작마다 최대값이 다르다) 넘는 것은 잘린다 — 많으면 스페이스·검색어·기간으로 조건을 좁혀 나누어 받는다. `GET /users`만 `offset`·`total`을 쓴다.
    이 API는 더하기만 한다(필드·경로 추가). 빼거나 뜻을 바꾸면 v2다.
  title: "워크플루언스 공개 API"
  version: "1.0.0"
openapi: "3.1.0"
paths:
  "/attachments/{id}":
    delete:
      description: "그 스페이스에 쓸 수 있는 사람, 또는 올린 사람이 지운다(중지된 스페이스에서는 아무도)."
      operationId: attachments.delete
      parameters:
        - description: "첨부의 id"
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            "application/json":
              schema:
                additionalProperties: false
                properties:
                  ok:
                    const: true
                    description: "성공이면 늘 true"
                    type: boolean
                required:
                  - ok
                type: object
          description: "성공"
        "400":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "입력이 틀렸다 — `error.code`와 `error.message`가 까닭을 말한다"
        "401":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰이 없거나 쓸 수 없다(만료·폐기·정지) — `TOKEN_*`"
        "403":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "scope가 모자라거나(`INSUFFICIENT_SCOPE`) 사람의 권한이 없다(`FORBIDDEN`) — 토큰은 사람보다 더 할 수 없다"
        "404":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "없거나 볼 수 없다 — 둘을 구별하지 않는다"
        "409":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "요청이 지금의 상태와 맞지 않는다 — `error.code`와 `error.message`가 까닭을 말한다(다시 읽어 상태를 확인한 뒤 고쳐서 보낸다)"
        "429":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰별 빈도 제한을 넘었다 — `Retry-After`(초)만큼 기다린다"
      security:
        - bearerAuth:
            - write
      summary: "첨부 지우기"
      tags:
        - attachments
    get:
      description: "기본은 바이너리 그대로다. `format=json`이면 글은 utf8, 바이너리는 base64로 JSON에 담는다(1000000바이트까지 — 넘으면 413). 받은 일은 감사에 남는다."
      operationId: attachments.download
      parameters:
        - description: "첨부의 id"
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
        - description: "`json`이면 파일을 JSON(`encoding`·`content` — 글은 utf8, 이진은 base64)으로 싸서 돌려준다. 안 주면 파일 그대로 내려받는다(413 `TOO_LARGE_FOR_JSON` — 너무 크면 JSON으로 못 받는다)"
          in: query
          name: format
          required: false
          schema:
            enum:
              - json
            type: string
      responses:
        "200":
          content:
            "application/octet-stream":
              schema:
                type: string
          description: "파일 내용. `format=json`이면 application/json의 { id, filename, mime, size, encoding, content }"
        "400":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "입력이 틀렸다 — `error.code`와 `error.message`가 까닭을 말한다"
        "401":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰이 없거나 쓸 수 없다(만료·폐기·정지) — `TOKEN_*`"
        "403":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "scope가 모자라거나(`INSUFFICIENT_SCOPE`) 사람의 권한이 없다(`FORBIDDEN`) — 토큰은 사람보다 더 할 수 없다"
        "404":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "없거나 볼 수 없다 — 둘을 구별하지 않는다"
        "429":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰별 빈도 제한을 넘었다 — `Retry-After`(초)만큼 기다린다"
      security:
        - bearerAuth:
            - read
      summary: "첨부 받기"
      tags:
        - attachments
  "/audit":
    get:
      description: "행위(`action`)·사람(`actorId`)·기간(`from`·`to`)·요청 번호(`requestId`)로 거른다. 읽기 전용이다(append-only) — 쓰는 경로는 없다. 응답을 `{items}`로 싼다(화면용은 배열)."
      operationId: audit.list
      parameters:
        - description: "돌려줄 가장 많은 수 — 넘으면 400이고 안 주면 기본값"
          in: query
          name: limit
          required: false
          schema:
            default: 200
            maximum: 500
            minimum: 1
            type: integer
        - description: "행위 코드로 거른다. 값: auth.login.success · auth.login.failure · auth.logout · auth.password.change · auth.id.recover · auth.password.recover · user.signup · user.create · user.approve · user.unlock · user.password.reset · user.sessions.terminate · user.role.change · user.grants.change · user.suspend · user.unsuspend · category.create · space.create · space.update · space.status.change · space.delete · space.member.add · space.member.role.change · space.member.remove · page.create · page.update · page.move · page.delete · page.restore · page.version.restore · attachment.upload · attachment.download · attachment.delete · comment.create · comment.update · comment.delete · page.restore.trash · space.restore · trash.purge · audit.purge · backup.create · backup.restore · label.attach · label.detach · category.update · category.delete · settings.update · page.export · page.collab.save · page.collab.flush · page.collab.title · template.create · template.update · template.delete · mail.send · mail.fail · page.collab.reject · llm.provider.create · llm.provider.delete · llm.ask · llm.conversation.purge · auth.password.reset.request · auth.password.reset · auth.email.help · api_token.create · api_token.revoke"
          in: query
          name: action
          required: false
          schema:
            maxLength: 60
            type: string
        - description: "그 일을 한 사용자의 id로 거른다"
          in: query
          name: actorId
          required: false
          schema:
            format: uuid
            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            type: string
        - description: "이 시각부터(포함) — ISO 8601(예: 2026-10-08T09:00:00Z). 날짜만 주면 그날 00:00부터"
          in: query
          name: from
          required: false
          schema: {}
        - description: "이 시각까지(제외) — ISO 8601(예: 2026-10-08T18:00:00Z). 날짜만 주면 그날 00:00까지"
          in: query
          name: to
          required: false
          schema: {}
        - description: "요청 번호로 거른다 — 오류 응답의 `error.requestId`나 로그 한 줄의 값"
          in: query
          name: requestId
          required: false
          schema:
            pattern: "^[A-Za-z0-9-]{8,64}$"
            type: string
      responses:
        "200":
          content:
            "application/json":
              schema:
                additionalProperties: false
                properties:
                  items:
                    description: "결과 목록 — 없으면 빈 배열"
                    items:
                      additionalProperties: false
                      properties:
                        action:
                          description: "행위 코드(예: page.delete, api_token.create)"
                          type: string
                        actorId:
                          description: "그 일을 한 사용자의 id — 시스템이 했으면 null"
                          type:
                            - string
                            - "null"
                        actorName:
                          description: "그 일을 한 사람의 이름"
                          type:
                            - string
                            - "null"
                        createdAt:
                          description: "ISO 8601 시각(UTC)"
                          type: string
                        detail:
                          anyOf:
                            - additionalProperties: {}
                              propertyNames:
                                type: string
                              type: object
                            - type: "null"
                          description: "그 행위의 자세한 내용(행위마다 다르다 — 예: `settings.update`는 `{ before, after }`로 바뀐 정책의 이전·이후 값) — 토큰으로 한 요청이면 `jti`가 그 토큰의 번호"
                        id:
                          description: "그 대상의 id — 다른 호출의 경로에 넣는다"
                          type: string
                        ip:
                          description: "요청한 주소(없으면 null)"
                          type:
                            - string
                            - "null"
                        requestId:
                          description: "그 행을 남긴 요청의 번호 — 로그 한 줄의 requestId와 같다"
                          type:
                            - string
                            - "null"
                        targetId:
                          description: "그 일을 당한 대상의 id"
                          type:
                            - string
                            - "null"
                        targetType:
                          description: "그 일을 당한 대상의 종류"
                          type:
                            - string
                            - "null"
                      required:
                        - id
                        - action
                        - actorId
                        - actorName
                        - targetType
                        - targetId
                        - detail
                        - ip
                        - requestId
                        - createdAt
                      type: object
                    type: array
                required:
                  - items
                type: object
          description: "성공"
        "400":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "입력이 틀렸다 — `error.code`와 `error.message`가 까닭을 말한다"
        "401":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰이 없거나 쓸 수 없다(만료·폐기·정지) — `TOKEN_*`"
        "403":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "scope가 모자라거나(`INSUFFICIENT_SCOPE`) 사람의 권한이 없다(`FORBIDDEN`) — 토큰은 사람보다 더 할 수 없다"
        "404":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "없거나 볼 수 없다 — 둘을 구별하지 않는다"
        "429":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰별 빈도 제한을 넘었다 — `Retry-After`(초)만큼 기다린다"
      security:
        - bearerAuth:
            - admin
            - read
      summary: "감사로그 읽기"
      tags:
        - admin
  "/categories":
    get:
      description: "스페이스를 묶는 분류. 각 항목이 내가 이름을 바꾸거나 지울 수 있는지(`canRename`·`canDelete`)를 말한다."
