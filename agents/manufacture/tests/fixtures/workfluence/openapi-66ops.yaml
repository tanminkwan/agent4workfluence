      description: "그 사람의 세션·토큰·편집 연결이 그 자리에서 끊기고 로그인하지 못한다. 내용·감사는 남는다."
      operationId: users.suspend
      parameters:
        - description: "사용자의 id"
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "201":
          content:
            "application/json":
              schema:
                additionalProperties: false
                properties:
                  createdAt:
                    description: "ISO 8601 시각(UTC)"
                    type: string
                  displayName:
                    description: "화면에 보이는 이름"
                    type: string
                  email:
                    description: "이메일 주소(없으면 null)"
                    type:
                      - string
                      - "null"
                  grants:
                    description: "받은 위임의 목록(없으면 빈 배열)"
                    items:
                      enum:
                        - llm.manage
                        - category.manage
                        - space.unsuspend
                        - space.oversee
                      type: string
                    type: array
                  id:
                    description: "그 대상의 id — 다른 호출의 경로에 넣는다"
                    type: string
                  mustChangePassword:
                    description: "다음 로그인에서 비밀번호를 바꿔야 하면 true"
                    type: boolean
                  role:
                    description: "역할 — root·admin·member (Crew는 owner·editor·viewer)"
                    enum:
                      - root
                      - admin
                      - member
                    type: string
                  status:
                    description: "상태 — 스페이스는 active·suspended, 사용자는 pending·active·locked·suspended"
                    enum:
                      - pending
                      - active
                      - suspended
                      - locked
                    type: string
                  username:
                    description: "사용자 아이디(로그인 이름)"
                    type: string
                required:
                  - id
                  - username
                  - displayName
                  - email
                  - role
                  - status
                  - mustChangePassword
                  - grants
                  - createdAt
                type: object
          description: "성공"
        "400":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "입력이 틀렸다 — `error.code`와 `error.message`가 까닭을 말한다"
        "401":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰이 없거나 쓸 수 없다(만료·폐기·정지) — `TOKEN_*`"
        "403":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "scope가 모자라거나(`INSUFFICIENT_SCOPE`) 사람의 권한이 없다(`FORBIDDEN`) — 토큰은 사람보다 더 할 수 없다"
        "404":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "없거나 볼 수 없다 — 둘을 구별하지 않는다"
        "409":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "요청이 지금의 상태와 맞지 않는다 — `error.code`와 `error.message`가 까닭을 말한다(다시 읽어 상태를 확인한 뒤 고쳐서 보낸다)"
        "429":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "토큰별 빈도 제한을 넘었다 — `Retry-After`(초)만큼 기다린다"
      security:
        - bearerAuth:
            - admin
            - write
      summary: "계정 정지"
      tags:
        - admin
  "/users/{id}/terminate-sessions":
