                      type: boolean
                    canRename:
                      description: "내가 이름을 바꿀 수 있으면 true"
                      type: boolean
                    id:
                      description: "그 대상의 id — 다른 호출의 경로에 넣는다"
                      type: string
                    name:
                      description: "이름"
                      type: string
                  required:
                    - id
                    - name
                    - canRename
                    - canDelete
                  type: object
                type: array
          description: "성공"
        "400":
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
          description: "입력이 틀렸다 — `error.code`와 `error.message`가 까닭을 말한다"
        "401":
          content:
            "application/json":
